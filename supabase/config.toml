  [functions.record-auth-wedge]
    # Public auth-recovery beacon — by definition the caller has no valid
    # JWT to present. Hardened in-code: strict enum allow-lists, body cap,
    # per-IP rate limit, daily-salted IP hash (no raw IPs stored).
    verify_jwt = false
  [functions.auth-broker]
    # Single edge function fronting every credentialed auth operation
    # (sign-in/password, sign-up, password-reset, sign-out, session/refresh,
    # identity/check, sign-in/google-callback). Public surface — the broker
    # enforces its own zod input validation, per-IP/per-email rate limits
    # via peek_rate_limit, and CAPTCHA in-code. Server is the only place
    # GoTrue error messages may be translated to AuthErrorCode.
    verify_jwt = false
  [functions.record-auth-recovery]
    # Public reset-flow telemetry beacon — by definition the caller has no
    # valid auth session (that's the failure we are diagnosing). Hardened
    # in-code: strict enum allow-lists, body cap, per-IP rate limit,
    # daily-salted IP hash. No tokens, emails, or full URLs accepted.
    verify_jwt = false
  [functions.record-auth-event]
    # AUTH-ENGINE Ship 6: client-emitted `auth_engine.*` state-transition
    # pings (started/succeeded/failed/captcha_failed/reset_succeeded/…).
    # Fires before a session exists (e.g. on the /login screen), so JWT
    # cannot be required. Hardened in-code by a kind allowlist + 1KB
    # payload cap; writes via record_event(sink='ops_events', severity='info')
    # so rows never reach Triage. See docs/runbooks/auth-rebuild-soak.md.
    verify_jwt = false
