# Dependabot - automated supply-chain updates per OWASP A03:2025
# - npm: weekly grouped PRs to keep churn manageable
# - github-actions: weekly, ensures workflow action SHAs stay current
# Security updates are handled out-of-band by Dependabot's daily security PRs
# (no `schedule.interval` override needed - they always run when CVEs land).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    ignore:
      # Ignore ALL major-version bumps. A major is a breaking rewrite that needs
      # a deliberate migration, not an auto-bump. Two majors auto-merged and each
      # froze the production build: tailwindcss v3->v4 (11-day freeze; pinned in
      # #67, PR #83 closed) and react-router v6->v8 (#85; fixed in #95). Majors
      # are opened by hand when we choose to migrate.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      production-minor-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      dev-minor-patch:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "supply-chain"
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci(actions)"
