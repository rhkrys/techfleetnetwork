# Dependabot — automated supply-chain updates per OWASP A03:2025
# - npm: weekly grouped PRs to keep churn manageable
# - github-actions: weekly, ensures workflow action SHAs stay current
# Security updates are handled out-of-band by Dependabot's daily security PRs
# (no `schedule.interval` override needed — they always run when CVEs land).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    ignore:
      # Major-version bumps of the build/CSS toolchain are breaking rewrites
      # that require a deliberate migration, not an auto-bump. Tailwind v4
      # (v3→v4) froze the Cloudflare production build for 11 days — pinned back
      # to v3 in #67, PR #83 (auto-bump to 4.x) closed. Keep majors out until we
      # migrate on purpose.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # react-router was auto-bumped to v8 (#85) while react-router-dom stayed
      # v6 — an incompatible split that broke the Cloudflare build. The app uses
      # the react-router-dom v6 API (105 imports). Realign happens on purpose.
      - dependency-name: "react-router"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router-dom"
        update-types: ["version-update:semver-major"]
    groups:
      production-minor-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      dev-minor-patch:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "supply-chain"
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci(actions)"
