name: Cross-browser QA

on:
  # Visual-regression suite still runs on PR (cheap, fast, blocks pixel drift).
  # The full desktop+mobile+tablet matrix is nightly + manual only — the
  # fast Chromium shard in regression.yml covers PRs.
  pull_request:
    paths:
      - "e2e/visual/**"
      - "src/**"
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

concurrency:
  group: cross-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright-full-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      PLAYWRIGHT_FULL_MATRIX: "1"
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
      TF_ADMIN_EMAIL: ${{ secrets.TF_ADMIN_EMAIL }}
      TF_ADMIN_PASSWORD: ${{ secrets.TF_ADMIN_PASSWORD }}
      VITE_A11Y_AUDIT_BYPASS_ADMIN_PASSKEY_GATE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Cache node_modules
        id: cache-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-node-v2-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-v2-

      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install Playwright browsers
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
        with:
          timeout_minutes: 12
          max_attempts: 3
          command: npx playwright install --with-deps chromium firefox webkit

      - name: Run desktop, mobile, and tablet browser matrix
        run: npm run test:e2e:full:ci

      - name: Upload cross-browser artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cross-browser-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 90

  # ---------------------------------------------------------------------------
  # Track 1 — Visual regression on PR.
  # Runs only the `e2e/visual/*` suite under chromium + mobile-chrome (the
  # cross-platform pixel jitter on firefox/webkit makes them unreliable for
  # pixel diffs; functional E2E covers those engines).
  # On the `visual-baseline-update` label, the job re-runs with
  # --update-snapshots and uploads the new baselines as an artifact for review.
  # ---------------------------------------------------------------------------
  visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PLAYWRIGHT_VISUAL: "1"
      PLAYWRIGHT_START_SERVER: "1"
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Cache node_modules
        id: cache-modules-visual
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-node-v2-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-v2-

      - name: Install dependencies
        if: steps.cache-modules-visual.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install Playwright (chromium only — pixel diff suite)
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
        with:
          timeout_minutes: 8
          max_attempts: 3
          command: npx playwright install --with-deps chromium

      - name: Detect baseline-update label
        id: update-flag
        run: |
          if [ "${{ contains(github.event.pull_request.labels.*.name, 'visual-baseline-update') }}" = "true" ]; then
            echo "update=1" >> "$GITHUB_OUTPUT"
          else
            echo "update=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Run visual regression suite
        run: |
          if [ "${{ steps.update-flag.outputs.update }}" = "1" ]; then
            npm run test:visual:update
          else
            npm run test:visual
          fi

      - name: Upload visual diffs (on failure) or new baselines (on label)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: visual-regression-report
          path: |
            playwright-report/
            test-results/
            e2e/visual/**/*.png
          retention-days: 30
