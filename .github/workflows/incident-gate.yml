name: Incident gate

# Every resolved fingerprint in known_issue_catalog must be locked in by a
# regression scenario tagged `incident:<fingerprint>` (BDD Wave 4).
#
# SECURITY — why this runs on push/schedule and NOT pull_request:
# this gate is DB-backed and needs SUPABASE_SERVICE_ROLE_KEY (the key bypasses
# all RLS). On `pull_request` events GitHub exposes repo secrets to the workflow
# even for branch PRs, so a PR that edits scripts/bdd-incident-gate.mjs could
# exfiltrate the service-role key. Running only on trusted refs (push to main +
# schedule) means the key is only ever handed to code already merged to main.
# This was never a required PR check, so moving it off PRs changes no gate.

on:
  push:
    branches: [main]
  schedule:
    # Daily at 08:00 UTC — drift check independent of merge cadence.
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  group: incident-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  incident-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Cache node_modules
        id: cache-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-node-v2-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-v2-
      - name: Install dependencies (cache miss)
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund
      # Self-healing guard: skip (green) when the service-role key isn't set on
      # this project yet, instead of failing red with a 401. Reactivates the
      # regression-recurrence guard automatically once the secret is migrated
      # (baseline-restoration D-2).
      - name: Guard — service-role key present
        id: guard
        env:
          SRK: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SRK" ]; then
            echo "::notice::Incident gate SKIPPED — SUPABASE_SERVICE_ROLE_KEY not set on this project yet (baseline-restoration D-2). Set it to activate the regression-recurrence guard."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run incident gate
        if: steps.guard.outputs.present == 'true'
        run: node scripts/bdd-incident-gate.mjs
