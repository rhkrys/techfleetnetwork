name: CI

# Unified pipeline — single source of truth (replaces regression.yml).
# See CICD-PRD-v1.1.docx + the v1.2 critical-gaps addendum.
#
#   gate               REQUIRED   aggregator over gate-verify / gate-test / gate-build
#                                 / lint-arch-critical (auth-freeze invariants BLOCK)
#                                 / security-owasp (OWASP SAST + 120-sheet coverage BLOCK)
#   lint-arch          informational  remaining structural checks, parallel matrix
#   deno-check         BLOCKING (gate) edge-function typecheck + edge unit tests (PRD v1.2 D-25)
#   migration-smoke    conditional    runs only when supabase/migrations/ changes
#   e2e                conditional    Playwright vs LOCAL Supabase (Docker on the
#                                     runner — B-01/B-09), when src/ or functions/ change
#
# Branch protection requires "ci / gate" (+ migration-smoke on migration PRs and
# the Cloudflare "Workers Builds: techfleetnetwork" check).

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# OWASP CI/CD: least privilege by default; jobs opt into more.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # detect-changes — compute which conditional jobs need to run, from the diff.
  # Native git (no extra action dependency) to stay SHA-pin-clean.
  # ---------------------------------------------------------------------------
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}
      e2e: ${{ steps.filter.outputs.e2e }}
      functions: ${{ steps.filter.outputs.functions }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Compute changed paths
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            BASE="origin/${{ github.base_ref }}"
            CHANGED=$(git diff --name-only "$BASE"...HEAD)
          else
            BASE="${{ github.event.before }}"
            CHANGED=$(git diff --name-only "$BASE" HEAD 2>/dev/null || git diff --name-only HEAD~1 HEAD)
          fi
          echo "Changed files:"; echo "$CHANGED"
          if echo "$CHANGED" | grep -q '^supabase/migrations/'; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          else
            echo "migrations=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep -qE '^(src/|supabase/functions/)'; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep -q '^supabase/functions/'; then
            echo "functions=true" >> "$GITHUB_OUTPUT"
          else
            echo "functions=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # setup — install deps ONCE, share node_modules (zstd artifact) downstream.
  # ---------------------------------------------------------------------------
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Cache node_modules + npm tarballs
        id: cache-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-node-v2-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-v2-
      - name: Install dependencies (cache miss)
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Package node_modules for downstream jobs
        run: tar --use-compress-program=zstd -cf /tmp/node_modules.tar.zst node_modules
      - name: Upload node_modules artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: node-modules-${{ github.sha }}
          path: /tmp/node_modules.tar.zst
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # gate — THE required check (branch protection requires ONLY "ci / gate").
  # It is now a lightweight AGGREGATOR over three parallel jobs, so wall-clock is
  # the slowest job (≈ one test shard) instead of the SUM of every step. The old
  # single serial job hit the 25-min timeout; vitest (288 files) was the long
  # pole. Heavy work is split across:
  #   gate-verify  typecheck + eslint + stylelint + repo guards
  #   gate-test    vitest, sharded across 4 runners
  #   gate-build   production build + SBOM
  # No production dependency, no Playwright, no Supabase. Target: < 8 minutes.
  # ---------------------------------------------------------------------------
  gate-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: setup
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Restore node_modules
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: node-modules-${{ github.sha }}
          path: /tmp
      - run: tar --use-compress-program="zstd -d" -xf /tmp/node_modules.tar.zst

      # No-prod guard — gate must never call the production Supabase project.
      # (T2.1) Implemented as a repo grep over the test tree.
      - name: Guard — no production Supabase URL in tests
        run: node scripts/ci/check-no-prod-supabase-in-tests.mjs

      # No-hang guard — unguarded networkidle waits cause 45s CI hangs (P-15).
      - name: Guard — no unguarded waitForLoadState("networkidle") in e2e
        run: node scripts/ci/check-no-unguarded-networkidle.mjs

      # Lockfile guard — npm is canonical. A stray bun.lock made Cloudflare
      # build with bun (can't parse nested overrides) and froze prod 11 days.
      - name: Guard — no stray non-npm lockfiles
        run: node scripts/ci/check-no-stray-lockfiles.mjs

      # Migration-version guard — two migrations sharing a version prefix collide
      # on schema_migrations_pkey and break the blocking migration-smoke gate.
      # Parallel date-stamped PRs kept doing this; catch it at PR time, clearly.
      - name: Guard — no duplicate migration version prefixes
        run: node scripts/ci/check-migration-version-collision.mjs

      # ADR-number guard — two ADRs sharing a number is the same collision class
      # (parallel PRs each grab "next number"). 0009/0013/0014/0016 already doubled
      # because nothing guarded it; this blocks NEW collisions (0013/0014/0016 are
      # grandfathered in the script). See docs/adr/0019-architecture-gate.md.
      - name: Guard — no duplicate ADR numbers
        run: node scripts/ci/check-adr-number-collision.mjs

      # Meta-guard (GATE-INTEGRITY-001) — the checks must not pass falsely. Fails if
      # any guard swallows an error into exit(0) (a false green). See the gate-
      # integrity standard in decisions.md. A deliberate fail-open opts out with a
      # `// ci-guard-integrity-ok: <reason>` marker.
      - name: Guard — CI guards fail closed (no swallowed exit 0)
        run: node scripts/ci/check-ci-guard-integrity.mjs

      - name: Type-check
        run: npx tsc --noEmit
      - name: Lint (ESLint)
        run: npm run lint
      - name: Lint CSS
        run: npm run lint:css

  gate-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: setup
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Restore node_modules
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: node-modules-${{ github.sha }}
          path: /tmp
      - run: tar --use-compress-program="zstd -d" -xf /tmp/node_modules.tar.zst
      # Unit tests only, sharded across 4 runners. Intentionally NO
      # VITE_SUPABASE_URL: the suite must pass against jsdom + local fixtures,
      # never the live project (PRD G-03/P-05).
      - name: Unit tests (Vitest) — shard ${{ matrix.shard }}/4
        run: npx vitest run --shard=${{ matrix.shard }}/4

  gate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: setup
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Restore node_modules
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: node-modules-${{ github.sha }}
          path: /tmp
      - run: tar --use-compress-program="zstd -d" -xf /tmp/node_modules.tar.zst
      - name: Build production bundle
        run: npm run build
      - name: Generate CycloneDX SBOM
        run: npm run sbom
      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cyclonedx-sbom
          path: sbom.json
          retention-days: 90
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # security-owasp — OWASP secure-coding gate. BLOCKING (in the gate aggregator).
  # Two secret-free, dependency-free static checks that run on every PR/push:
  #   1. scripts/pentest/sast.mjs        — the full OWASP static SAST sweep
  #      (XSS/injection/authz/secrets/crypto/SSRF/CI-CD/edge-fn/… controls).
  #   2. scripts/ci/check-owasp-coverage — proves all 120 OWASP cheat sheets map
  #      to a real enforcing control (docs/security/owasp-coverage.md).
  # Node built-ins only, so NO npm install and NO secrets — it cannot be silently
  # skipped the way the secret-gated pentest.yml SAST run could. This is what
  # makes OWASP secure-coding checked on everything that deploys (push → main →
  # Cloudflare Pages), per the required "ci / gate".
  # ---------------------------------------------------------------------------
  security-owasp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: OWASP static SAST sweep (secret-free)
        run: node scripts/pentest/sast.mjs
      - name: OWASP 120-sheet coverage completeness
        run: node scripts/ci/check-owasp-coverage.mjs

  # ---------------------------------------------------------------------------
  # arch-gate — architecture gate (the four questions / structural drift).
  # BLOCKING (in the gate aggregator). Dependency-free scanner: the --changed
  # ratchet blocks NEW violations while pre-existing ones stay grandfathered in
  # arch-gate.waivers.json. Node built-ins only — no npm install, no secrets.
  # ---------------------------------------------------------------------------
  arch-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0 # full history so --changed can find the merge-base
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Architecture gate (ratchet — blocks new violations)
        run: npm run check:architecture

  # Required status check — stays named "gate" so branch protection is unchanged.
  # Aggregates the three parallel gate jobs and fails if any did not succeed.
  # `if: always()` so it still runs (and reports failure) when a dependency fails,
  # instead of being skipped (a skipped required check blocks the merge ambiguously).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      [
        gate-verify,
        gate-test,
        gate-build,
        lint-arch-critical,
        security-owasp,
        arch-gate,
        migration-smoke,
        deno-check,
      ]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Verify all gate jobs passed
        run: |
          verify='${{ needs.gate-verify.result }}'
          test='${{ needs.gate-test.result }}'
          build='${{ needs.gate-build.result }}'
          arch='${{ needs.lint-arch-critical.result }}'
          owasp='${{ needs.security-owasp.result }}'
          agate='${{ needs.arch-gate.result }}'
          migr='${{ needs.migration-smoke.result }}'
          dchk='${{ needs.deno-check.result }}'
          echo "gate-verify=$verify  gate-test=$test  gate-build=$build  lint-arch-critical=$arch  security-owasp=$owasp  arch-gate=$agate  migration-smoke=$migr  deno-check=$dchk"
          fail=0
          [ "$verify" = "success" ] || fail=1
          [ "$test" = "success" ] || fail=1
          [ "$build" = "success" ] || fail=1
          [ "$arch" = "success" ] || fail=1
          # security-owasp is unconditional (secret-free, no deps): must succeed.
          [ "$owasp" = "success" ] || fail=1
          # arch-gate is unconditional (dependency-free): must succeed.
          [ "$agate" = "success" ] || fail=1
          # migration-smoke is conditional: skipped (no migration changes) passes.
          if [ "$migr" != "success" ] && [ "$migr" != "skipped" ]; then fail=1; fi
          # deno-check is conditional on function changes: skipped (no function changes) passes,
          # otherwise it must succeed — this is what makes the edge-function unit tests block merge.
          if [ "$dchk" != "success" ] && [ "$dchk" != "skipped" ]; then fail=1; fi
          if [ "$fail" -ne 0 ]; then
            echo "::error::Gate failed (verify=$verify test=$test build=$build arch=$arch security-owasp=$owasp arch-gate=$agate migration-smoke=$migr deno-check=$dchk)."
            exit 1
          fi
          echo "All gate jobs passed."

  # ---------------------------------------------------------------------------
  # lint-arch-critical — auth-freeze / security invariants (CLAUDE.md). These
  # BLOCK merge: the gate aggregator requires this job (PRD v1.2 B-10 — an
  # auth-layer violation must never merge silently).
  # ---------------------------------------------------------------------------
  lint-arch-critical:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: setup
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        check:
          - check-auth-layer-graph.mjs
          - check-auth-result-contract.mjs
          - check-auth-counter-coverage.mjs
          - check-auth-engine-swallow.mjs
          - check-auth-screen-imports.mjs
          - check-auth-warn-snapshot.mjs
          - check-auth-direct-signin.mjs
          - check-no-direct-google-oauth.mjs
          - check-no-legacy-auth-service.mjs
          - check-legacy-auth-importers.mjs
          - check-email-architecture.mjs
          - check-email-tier-registry.mjs
          - check-no-raw-email-enqueue.mjs
          - check-no-tier0-preference-gate.mjs
          - check-no-unsigned-jwt-auth.mjs
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Restore node_modules
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: node-modules-${{ github.sha }}
          path: /tmp
      - run: tar --use-compress-program="zstd -d" -xf /tmp/node_modules.tar.zst
      - name: ${{ matrix.check }}
        run: node "scripts/ci/${{ matrix.check }}"

  # ---------------------------------------------------------------------------
  # lint-arch — remaining structural checks, parallel + isolated. One failing
  # script never skips the others. INFORMATIONAL: does not block merge.
  # ---------------------------------------------------------------------------
  lint-arch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: setup
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        check:
          - check-edge-function-coverage.mjs
          - check-plpgsql-variable-conflict.mjs
          - check-progress-read-identity.mjs
          - check-support-identity.mjs
          - check-no-rpc-catch.mjs
          - check-audit-sink-coverage.mjs
          - check-translator-volatile-regions.mjs
          - check-triage-actionable-parity.mjs
          - check-profiles-id-auth-uid.mjs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Restore node_modules
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: node-modules-${{ github.sha }}
          path: /tmp
      - run: tar --use-compress-program="zstd -d" -xf /tmp/node_modules.tar.zst
      - name: ${{ matrix.check }}
        run: node "scripts/ci/${{ matrix.check }}"

  # ---------------------------------------------------------------------------
  # audit-triggers — bash structural check kept separate (shell, not node).
  # Informational, same as lint-arch.
  # ---------------------------------------------------------------------------
  audit-triggers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: setup
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify audit trigger backstop
        run: bash scripts/ci/check-audit-triggers.sh

  # ---------------------------------------------------------------------------
  # migration-smoke — apply ALL migrations in sequence against a local Postgres.
  # Required for PRs that touch supabase/migrations/ (see branch protection).
  # ---------------------------------------------------------------------------
  migration-smoke:
    # Runs in parallel with the gate jobs (needs only detect-changes) so the
    # `gate` aggregator can REQUIRE it: a conditional job can't be a standalone
    # required check (it would leave non-migration PRs "Expected — waiting"
    # forever), so the aggregator treats skipped-as-pass instead.
    #
    # RE-ENABLED (audit H3/H4, 2026-08-08): now BLOCKING. A fresh
    # `supabase db reset` must apply the full migration history cleanly on every
    # migration-touching PR — this is the regression net that keeps RLS / RPC /
    # schema changes honest and is the DR/cutover prerequisite. Repairs landed to
    # get here: create try_write_audit_log (20260430021349, was referenced-before-
    # created), and stub+drop the `your_audit_function_name` placeholder REVOKE.
    # If this job fails, a migration does not apply from scratch — fix the SQL,
    # do NOT re-park it.
    needs: [detect-changes]
    if: needs.detect-changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install Supabase CLI (retrying download — setup-cli's npm fetch flakes on GitHub 503s)
        run: |
          ver=2.30.4
          url="https://github.com/supabase/cli/releases/download/v${ver}/supabase_linux_amd64.tar.gz"
          n=0; max=5; delay=6
          until curl -fSL --retry 6 --retry-all-errors --retry-delay 4 -o /tmp/supabase.tgz "$url"; do
            n=$((n + 1))
            [ "$n" -ge "$max" ] && { echo "::error::supabase CLI ${ver} download failed after ${max} attempts"; exit 1; }
            echo "::warning::supabase CLI download failed (attempt ${n}/${max}); retrying in ${delay}s"
            sleep "$delay"; delay=$((delay * 2))
          done
          tar -xzf /tmp/supabase.tgz -C /tmp supabase
          sudo install -m 0755 /tmp/supabase /usr/local/bin/supabase
          supabase --version
      - name: Start local Supabase (Postgres + pgvector)
        run: supabase start
      - name: Apply all migrations in sequence
        run: supabase db reset --no-seed
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  # ---------------------------------------------------------------------------
  # db-test — run the pgTAP suites in supabase/tests/ against a fresh local DB.
  # INFORMATIONAL first (not in the gate aggregator), matching how deno-check was
  # introduced: it surfaces DB-level security/RLS/RPC proofs on migration PRs
  # without blocking merge until a full green baseline is established, at which
  # point it should be promoted into the `gate` aggregator.
  # ---------------------------------------------------------------------------
  db-test:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install Supabase CLI (retrying download — setup-cli's npm fetch flakes on GitHub 503s)
        run: |
          ver=2.30.4
          url="https://github.com/supabase/cli/releases/download/v${ver}/supabase_linux_amd64.tar.gz"
          n=0; max=5; delay=6
          until curl -fSL --retry 6 --retry-all-errors --retry-delay 4 -o /tmp/supabase.tgz "$url"; do
            n=$((n + 1))
            [ "$n" -ge "$max" ] && { echo "::error::supabase CLI ${ver} download failed after ${max} attempts"; exit 1; }
            echo "::warning::supabase CLI download failed (attempt ${n}/${max}); retrying in ${delay}s"
            sleep "$delay"; delay=$((delay * 2))
          done
          tar -xzf /tmp/supabase.tgz -C /tmp supabase
          sudo install -m 0755 /tmp/supabase /usr/local/bin/supabase
          supabase --version
      - name: Start local Supabase (Postgres + pgTAP)
        run: supabase start
      - name: Apply migrations
        run: supabase db reset --no-seed
      - name: Run pgTAP suites
        run: supabase test db
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  # ---------------------------------------------------------------------------
  # e2e — Playwright against a LOCAL Supabase (Docker on the runner). Decision
  # B-01/B-09 (Morgan, 2026-07): ephemeral local instance per shard — zero cost,
  # perfect isolation, zero drift, no hosted-staging secrets. Never production.
  # ---------------------------------------------------------------------------
  e2e:
    needs: [detect-changes, setup, gate]
    if: needs.detect-changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      # Turnstile CI test key prevents the challenge from hanging headless
      # browsers (PRD D-18, auth stays frozen).
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Restore node_modules
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: node-modules-${{ github.sha }}
          path: /tmp
      - run: tar --use-compress-program="zstd -d" -xf /tmp/node_modules.tar.zst
      - name: Install Supabase CLI (retrying download — setup-cli's npm fetch flakes on GitHub 503s)
        run: |
          ver=2.30.4
          url="https://github.com/supabase/cli/releases/download/v${ver}/supabase_linux_amd64.tar.gz"
          n=0; max=5; delay=6
          until curl -fSL --retry 6 --retry-all-errors --retry-delay 4 -o /tmp/supabase.tgz "$url"; do
            n=$((n + 1))
            [ "$n" -ge "$max" ] && { echo "::error::supabase CLI ${ver} download failed after ${max} attempts"; exit 1; }
            echo "::warning::supabase CLI download failed (attempt ${n}/${max}); retrying in ${delay}s"
            sleep "$delay"; delay=$((delay * 2))
          done
          tar -xzf /tmp/supabase.tgz -C /tmp supabase
          sudo install -m 0755 /tmp/supabase /usr/local/bin/supabase
          supabase --version
      - name: Start local Supabase (Docker) + apply migrations
        run: |
          supabase start
          supabase db reset --no-seed
      - name: Export local Supabase env for the app build
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "VITE_SUPABASE_PROJECT_ID=local"
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - name: Seed e2e fixture data (local instance only)
        run: node scripts/ci/seed-e2e-fixtures.mjs
      # Permanent diagnostic (sre-operational-readiness: no silent failures).
      # On ANY e2e failure, dump the local Supabase DB + auth container logs so
      # the real Postgres error (trigger/constraint/RLS) is always visible —
      # turns an opaque "HTTP 500 / test failed" into the exact cause.
      - name: Dump Supabase DB + auth logs on failure
        if: failure()
        run: |
          echo "::group::Postgres (db) container logs — last 300 lines"
          db=$(docker ps -a --filter name=supabase_db --format '{{.Names}}' | head -1)
          if [ -n "$db" ]; then docker logs "$db" 2>&1 | tail -300; else echo "no supabase_db container found"; fi
          echo "::endgroup::"
          echo "::group::Auth (gotrue) container logs — last 200 lines"
          au=$(docker ps -a --filter name=supabase_auth --format '{{.Names}}' | head -1)
          if [ -n "$au" ]; then docker logs "$au" 2>&1 | tail -200; else echo "no supabase_auth container found"; fi
          echo "::endgroup::"
      - name: Resolve Playwright version
        id: pw-version
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}-chromium
      - name: Install Playwright browser (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
        with:
          timeout_minutes: 8
          max_attempts: 3
          command: npx playwright install --with-deps chromium
      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run Playwright shard ${{ matrix.shard }}/6
        run: npx playwright test --shard=${{ matrix.shard }}/6
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-blob-shard-${{ matrix.shard }}
          path: blob-report
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # deno-check — typecheck edge functions at PR time (PRD v1.2 D-25/P-21).
  # Previously a TS error in supabase/functions/** was only caught at deploy.
  # INFORMATIONAL first (not in the gate aggregator) — promoted to blocking
  # once a full green baseline is established.
  # ---------------------------------------------------------------------------
  deno-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.functions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Pin Deno's module/download cache to a workspace path we can persist
      # between runs (see the cache step). Steady-state = zero network fetches,
      # so an esm.sh / deno.land CDN blip can't fail the job.
      DENO_DIR: ${{ github.workspace }}/.deno-cache
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      # Persist downloaded remote deps across runs. Key on the hash of every .ts
      # under supabase/functions, so the cache only rebuilds when imports could
      # have changed; restore-keys lets an unchanged-deps PR reuse a prior cache.
      - name: Cache Deno dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.DENO_DIR }}
          key: deno-${{ runner.os }}-${{ hashFiles('supabase/functions/**/*.ts') }}
          restore-keys: |
            deno-${{ runner.os }}-
      - name: Type-check edge functions
        run: |
          set -u
          # deno_retry: retry ONLY transient remote-fetch failures (esm.sh /
          # deno.land CDN blips — e.g. HTTP 522 Cloudflare origin timeout), up to
          # 3x with exponential backoff. A genuine type error fails immediately
          # (no retry, no masking). Output is captured, printed, then classified.
          deno_retry() {
            local n=0 max=3 delay=5 out rc
            while :; do
              out="$("$@" 2>&1)"; rc=$?
              printf '%s\n' "$out"
              [ "$rc" -eq 0 ] && return 0
              if printf '%s' "$out" | grep -qiE 'failed: [0-9]{3}|<unknown status code>|error sending request|connection (closed|reset|refused)|(connection|operation) timed out|tcp connect error|dns error|502 bad gateway|503 service|504 gateway|429 too many'; then
                n=$((n + 1))
                if [ "$n" -ge "$max" ]; then
                  echo "::warning::transient remote-fetch failure persisted after ${max} attempts"
                  return "$rc"
                fi
                echo "::warning::transient remote-fetch failure (attempt ${n}/${max}); retrying in ${delay}s"
                sleep "$delay"; delay=$((delay * 2))
                continue
              fi
              return "$rc"
            done
          }
          fails=0; checked=0
          for d in supabase/functions/*/; do
            name="$(basename "$d")"
            [ "$name" = "_shared" ] && continue
            [ -f "${d}index.ts" ] || continue
            checked=$((checked + 1))
            echo "::group::deno check $name"
            if ! deno_retry deno check --no-lock --allow-import "${d}index.ts"; then
              echo "::error::deno check failed for $name"
              fails=$((fails + 1))
            fi
            echo "::endgroup::"
          done
          echo "Checked $checked functions; $fails failed."
          [ "$fails" -eq 0 ]
      # Edge unit gates: Fleety prompt (D-17b/c token ceiling + structure/order),
      # the Freescout base-URL config (env-override + https guard), and the shared
      # Gemini embedding contract (current model + query/doc symmetry). Fails on
      # prompt bloat/reorder, a bad Freescout host, or an embedding-model drift.
      - name: Edge unit gates (prompt + Freescout + embedding contract)
        run: |
          set -u
          # Same transient-fetch resilience as the type-check step: retry CDN
          # blips, fail fast on a real test failure.
          deno_retry() {
            local n=0 max=3 delay=5 out rc
            while :; do
              out="$("$@" 2>&1)"; rc=$?
              printf '%s\n' "$out"
              [ "$rc" -eq 0 ] && return 0
              if printf '%s' "$out" | grep -qiE 'failed: [0-9]{3}|<unknown status code>|error sending request|connection (closed|reset|refused)|(connection|operation) timed out|tcp connect error|dns error|502 bad gateway|503 service|504 gateway|429 too many'; then
                n=$((n + 1))
                if [ "$n" -ge "$max" ]; then
                  echo "::warning::transient remote-fetch failure persisted after ${max} attempts"
                  return "$rc"
                fi
                echo "::warning::transient remote-fetch failure (attempt ${n}/${max}); retrying in ${delay}s"
                sleep "$delay"; delay=$((delay * 2))
                continue
              fi
              return "$rc"
            done
          }
          deno_retry deno test --no-lock --allow-import --allow-env --allow-read \
            supabase/functions/techfleet-chat/prompt.test.ts \
            supabase/functions/_shared/freescout.test.ts \
            supabase/functions/_shared/gemini-embed.test.ts \
            supabase/functions/_shared/idempotency.test.ts \
            supabase/functions/edge-deploy-smoke/alerts.test.ts \
            supabase/functions/gumroad-webhook/lifecycle.test.ts \
            supabase/functions/send-announcement-email/message-id.test.ts \
            supabase/functions/send-announcement-email/attestation.test.ts \
            supabase/functions/process-freescout-events/auth.test.ts \
            supabase/functions/reap-class-module-orphans/lib.test.ts \
            supabase/functions/_shared/confirm-role.test.ts \
            supabase/functions/_shared/translation-guard.test.ts \
            supabase/functions/_shared/escape-html.test.ts \
            supabase/functions/_shared/email/domain/email-tiers.test.ts \
            supabase/functions/sync-airtable/ownership.test.ts \
            supabase/functions/_shared/client-ip.test.ts \
            supabase/functions/_shared/bounded-body.test.ts \
            supabase/functions/discord-interactions/freshness.test.ts \
            supabase/functions/handoff-produce/ \
            supabase/functions/handoff-submit/ \
            supabase/functions/handoff-worker/ \
            supabase/functions/handoff-download/ \
            supabase/functions/spf-sync/ \
            supabase/functions/_shared/spf/ \
            supabase/functions/_shared/llm/ \
            supabase/functions/_shared/email-octopus/ \
            supabase/functions/email-octopus-sync/ \
            supabase/functions/eo-contact-status/

  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
