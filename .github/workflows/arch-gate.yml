# Architecture gate — the mechanical half of the blocking architecture gate.
# Matches this repo's *-gate.yml convention (bdd-gate, incident-gate). Runs the dependency-free
# scanner in --changed (ratchet) mode: it blocks NEW architectural violations without demanding a
# big-bang cleanup of the existing tree (pre-existing violations live in arch-gate.waivers.json).
name: architecture-gate

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege: the gate only reads the checkout (enforced by the OWASP SAST gate).
permissions:
  contents: read

jobs:
  arch-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so --changed can find the merge-base

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No install needed — scripts/ci/arch-gate.mjs uses only Node built-ins.
      - name: Architecture gate (ratchet — blocks new violations)
        run: npm run check:architecture
