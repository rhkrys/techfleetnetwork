name: Config preflight

# PRD v1.2 D-22/P-18: config drift must be detected BEFORE an outage.
# Every cutover-era incident was silent config drift: the Send Email hook
# toggled off, cron jobs missing, Vault secrets absent, private-schema grants
# dropped, AND (2026-08-26) a DB migration present in main but never applied to
# prod — the Discord-linking outage, where create_discord_oauth_state was
# missing and every link attempt got PGRST202. This workflow asserts the
# required project configuration daily, on every migration merge to main, and on
# demand, and fails loudly — the Main failure alert workflow pages Discord.
#
# Secrets used (already configured): SUPABASE_ACCESS_TOKEN (Management API),
# SUPABASE_SERVICE_ROLE_KEY (PostgREST call to environment_readiness()).

on:
  schedule:
    - cron: "0 7 * * *" # daily 07:00 UTC
  push:
    branches: [main]
    # Catch "migration merged but never applied to prod" the moment it lands,
    # not only at the next daily run. The scheduled run still covers drift from
    # any other source.
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: pzvqxdgoztbfikfuifix
  SUPABASE_URL: https://pzvqxdgoztbfikfuifix.supabase.co

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # SHA-pinned actions/checkout@v4 (matches deploy-edge-functions.yml).
        # Needed so the migration-drift check can read supabase/migrations/.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Self-healing guard: when the Management-API / service-role secrets are
      # not yet migrated to this project, SKIP (green) instead of failing red.
      # The check reactivates automatically the moment the secrets are set —
      # see baseline-restoration D-2. This keeps CI green without deleting the
      # drift guard (which caught the July signup/reset outage).
      - name: Guard — required secrets present
        id: guard
        env:
          MGMT: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SRK: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$MGMT" ] || [ -z "$SRK" ]; then
            echo "::notice::Config preflight SKIPPED — SUPABASE_ACCESS_TOKEN / SUPABASE_SERVICE_ROLE_KEY not set on this project yet (baseline-restoration D-2). Set them to activate this drift guard."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
          # Migration-drift detection needs ONLY the Management API token, so it
          # gets its OWN gate. A missing/rotated SERVICE_ROLE_KEY (unrelated to
          # migration history) must never be able to silently disable the one
          # check that catches an un-applied migration — the 2026-08-26 incident.
          if [ -n "$MGMT" ]; then
            echo "mgmt_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "mgmt_present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Migration-drift check skipped — SUPABASE_ACCESS_TOKEN not set."
          fi

      - name: Auth config — Send Email hook enabled + pointed at auth-email-hook
        if: steps.guard.outputs.present == 'true'
        env:
          MGMT: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          cfg=$(curl -sf -H "Authorization: Bearer $MGMT" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth")
          enabled=$(echo "$cfg" | jq -r '.hook_send_email_enabled')
          uri=$(echo "$cfg" | jq -r '.hook_send_email_uri')
          expected="$SUPABASE_URL/functions/v1/auth-email-hook"
          echo "hook_send_email_enabled=$enabled"
          echo "hook_send_email_uri=$uri"
          fail=0
          if [ "$enabled" != "true" ]; then
            echo "::error::Send Email hook is DISABLED — auth emails are falling back to the rate-limited built-in sender (this exact drift caused the July signup/reset outage)."
            fail=1
          fi
          if [ "$uri" != "$expected" ]; then
            echo "::error::Send Email hook URI drifted: '$uri' (expected '$expected')."
            fail=1
          fi
          exit $fail

      - name: Database readiness — environment_readiness() has no missing/error rows
        if: steps.guard.outputs.present == 'true'
        env:
          SRK: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          rows=$(curl -sf -X POST "$SUPABASE_URL/rest/v1/rpc/environment_readiness" \
            -H "apikey: $SRK" -H "Authorization: Bearer $SRK" \
            -H "Content-Type: application/json" -d '{}')
          echo "$rows" | jq -r '.[] | "\(.status)\t\(.category)\t\(.item)\t\(.detail // "")"' | column -t -s $'\t'
          bad=$(echo "$rows" | jq '[.[] | select(.status == "missing" or .status == "error")] | length')
          if [ "$bad" -gt 0 ]; then
            echo "::error::environment_readiness() reports $bad missing/error item(s) — see table above. Fix the drift before it becomes an outage."
            exit 1
          fi
          echo "All readiness checks green."

      - name: Migration drift — prod schema history is not behind main
        # THE guard for the 2026-08-26 Discord-linking outage: a migration in
        # main that was never applied to prod. Reads prod's applied versions
        # (supabase_migrations.schema_migrations) via the Management API query
        # endpoint — same token as the auth-config check above, a read-only
        # SELECT — and diffs them against the migration files main expects. Any
        # version main has that prod lacks = drift = fail (and page). Resolve by
        # reviewing the plan, then `supabase db push --include-all`.
        if: steps.guard.outputs.mgmt_present == 'true'
        env:
          MGMT: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Read-only SELECT — this query MUST stay a read-only SELECT (the
          # Management token can also mutate; nothing structural stops that).
          resp=$(curl -sf -X POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $MGMT" -H "Content-Type: application/json" \
            -d '{"query":"select version from supabase_migrations.schema_migrations order by version"}') \
            || { echo "::error::Could not read prod migration history (Management API query). Failing loud rather than hiding possible drift."; exit 1; }
          # Accept an array of row objects ([{"version":...}]) or of scalars; any
          # other shape yields empty -> the -z check below fails LOUD (never a
          # silent pass). `|| true` only keeps the runner's default -e from
          # aborting before that explicit, clearer check.
          applied=$(printf '%s' "$resp" | jq -r '.[] | if type=="object" then .version else . end' 2>/dev/null | sort -u || true)
          if [ -z "$applied" ]; then
            echo "::error::Prod returned no applied migrations — unexpected shape. Raw response: $resp"
            exit 1
          fi
          # Versions main expects: the numeric prefix of every migration file.
          expected=$(for f in supabase/migrations/*.sql; do basename "$f"; done \
                      | sed -E 's/^([0-9]+)_.*/\1/' | sort -u)
          # No `|| true` here: comm has no backstop check after it, so a comm
          # failure must fail LOUD (red), never degrade to a green "aligned".
          missing=$(comm -23 <(printf '%s\n' "$expected") <(printf '%s\n' "$applied"))
          if [ -n "$missing" ]; then
            echo "::error::Prod is BEHIND main. These migration version(s) are in the repo but NOT applied to prod — review the plan, then apply with 'supabase db push --include-all':"
            printf '  %s\n' $missing
            exit 1
          fi
          echo "Migration history aligned — prod has all $(printf '%s\n' "$expected" | wc -l) migration version(s) in main."
