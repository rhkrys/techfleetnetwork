name: Regression

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      full_browser_matrix:
        description: "Run the full desktop/mobile/tablet browser matrix"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  schedule:
    # Nightly at 07:00 UTC — recurring full browser drift check.
    - cron: "0 7 * * *"

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# OWASP CI/CD security: minimum permissions on every job. Each job opts into more.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # setup — install dependencies ONCE, share node_modules + bun + playwright
  # browsers with downstream jobs. Cuts wall time ~60% vs. 4× npm ci.
  # ---------------------------------------------------------------------------
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      cache-hit: ${{ steps.cache-modules.outputs.cache-hit }}
    steps:
      - name: Checkout
        # actions/checkout@v5.0.0 — pinned to commit SHA (OWASP CI/CD)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Setup Node
        # actions/setup-node@v5.0.0 — pinned to commit SHA
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc

      - name: Setup Bun (for any predev/prebuild fallback scripts)
        # oven-sh/setup-bun@v2.2.0 — pinned to commit SHA
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Cache node_modules + npm tarballs
        id: cache-modules
        # actions/cache@v5.0.5 — pinned to commit SHA
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-node-v2-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-v2-

      - name: Install dependencies (cache miss)
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Package node_modules for downstream jobs
        run: tar --use-compress-program=zstd -cf /tmp/node_modules.tar.zst node_modules

      - name: Upload node_modules artifact
        # actions/upload-artifact@v7.0.1 — pinned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: node-modules-${{ github.sha }}
          path: /tmp/node_modules.tar.zst
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # quality — lint, typecheck, build, vitest, sbom, bdd-coverage in one job.
  # Same dep tree, no browsers needed — collapsing saves 3 cold starts.
  # ---------------------------------------------------------------------------
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: setup
    permissions:
      contents: read
    env:
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Restore node_modules
        # actions/download-artifact@v8.0.1 — pinned
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: node-modules-${{ github.sha }}
          path: /tmp
      - run: tar --use-compress-program="zstd -d" -xf /tmp/node_modules.tar.zst

      - name: Verify package signatures
        run: npm audit signatures
        continue-on-error: true

      - name: Lint (ESLint + browser-compat + CSS portability)
        run: npm run lint

      - name: Lint CSS
        run: npm run lint:css

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build production bundle
        run: npm run build

      - name: Run Vitest regression suite
        run: npm run test

      - name: Verify audit trigger backstop
        run: npm run check:audit-triggers

      - name: Verify every edge function is pinned in config.toml
        run: node scripts/ci/check-edge-function-coverage.mjs

      - name: Verify plpgsql RETURNS TABLE functions guard against OUT-param shadowing
        run: node scripts/ci/check-plpgsql-variable-conflict.mjs

      - name: Verify journey/course reads filter by session user.id (JOURNEY-IDENTITY-003)
        run: node scripts/ci/check-progress-read-identity.mjs

      - name: Verify signed-in members can read own progress rows (JOURNEY-IDENTITY-001)
        run: node scripts/ci/check-progress-identity-sql-smoke.mjs

      - name: Verify email subsystem v2 layering (domain pure, application port-only)
        run: node scripts/ci/check-email-architecture.mjs

      - name: Verify auth failure counters only fire from AuthFailurePolicy
        run: node scripts/ci/check-auth-counter-coverage.mjs

      - name: Verify every auth flow returns Result<AuthOk, AuthErr>
        run: node scripts/ci/check-auth-result-contract.mjs

      - name: Verify auth feature layer graph (ui → state → flows → services → domain)
        run: node scripts/ci/check-auth-layer-graph.mjs

      - name: Verify legacy auth importer allowlist (Ship 5 of auth rebuild)
        run: node scripts/ci/check-legacy-auth-importers.mjs

      - name: Verify single Google OAuth entrypoint (AUTH-ARCH-CUTOVER-004)
        run: node scripts/ci/check-no-direct-google-oauth.mjs

      - name: Verify password sign-in single owner (AUTH-DIRECT-SIGNIN)
        run: node scripts/ci/check-auth-direct-signin.mjs

      - name: Verify auth engines never swallow errors (AUTH-ARCH-CUTOVER-011)
        run: node scripts/ci/check-auth-engine-swallow.mjs

      - name: Verify legacy src/services/auth.service.ts stays deleted (AUTH-ARCH-CUTOVER-015)
        run: node scripts/ci/check-no-legacy-auth-service.mjs




      - name: Verify no opaque "Script error." rows landed in last 24h
        if: ${{ env.PGHOST != '' }}
        run: node scripts/ci/check-no-opaque-script-error.mjs

      - name: Security headers smoke (OWASP A02 — non-blocking)
        continue-on-error: true
        env:
          RUN_SECURITY_HEADERS_SMOKE: "1"
          SECURITY_HEADERS_HOST: "https://techfleet.network"
        run: npx vitest run src/test/smoke/security-headers.smoke.test.ts

      - name: Generate CycloneDX SBOM
        run: npm run sbom

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cyclonedx-sbom
          path: sbom.json
          retention-days: 90

      - name: Generate BDD coverage report (gracefully skip if vars unset)
        if: env.SUPABASE_URL != '' && env.SUPABASE_ANON_KEY != ''
        run: npx tsx scripts/bdd-coverage.ts

      - name: BDD coverage skipped (missing env)
        if: env.SUPABASE_URL == '' || env.SUPABASE_ANON_KEY == ''
        run: echo "::notice::Skipping BDD coverage — SUPABASE_URL or SUPABASE_ANON_KEY not configured."

      - name: BDD scenario runner (reporting only)
        if: env.SUPABASE_URL != '' && env.SUPABASE_ANON_KEY != ''
        run: node scripts/bdd-scenario-runner.mjs

  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Dependency Review
        # actions/dependency-review-action@v4.5.0 — pinned
        uses: actions/dependency-review-action@4081bf99e2866ebe428fc0477b69eb4fcda7220a
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # ---------------------------------------------------------------------------
  # playwright — Chromium-only fast gate, sharded 3-way for parallelism.
  # Cross-browser matrix lives in cross-browser.yml (nightly + manual).
  # ---------------------------------------------------------------------------
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    needs: setup
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Restore node_modules
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: node-modules-${{ github.sha }}
          path: /tmp
      - run: tar --use-compress-program="zstd -d" -xf /tmp/node_modules.tar.zst

      - name: Resolve Playwright version
        id: pw-version
        run: |
          PW_VER=$(node -p "require('./node_modules/@playwright/test/package.json').version")
          echo "version=$PW_VER" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}-chromium

      - name: Install Playwright browser (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        # nick-fields/retry@v4.0.0 — pinned
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
        with:
          timeout_minutes: 8
          max_attempts: 3
          command: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright shard ${{ matrix.shard }}/6
        run: npx playwright test --shard=${{ matrix.shard }}/6

      - name: Upload blob report (for cross-shard merge)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-blob-shard-${{ matrix.shard }}
          path: blob-report
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-fast-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # merge-reports — combine all 6 shard blob reports into one HTML report.
  # Runs even if some shards failed so we always get a single report to open.
  # ---------------------------------------------------------------------------
  merge-reports:
    if: ${{ !cancelled() }}
    needs: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc

      - name: Restore node_modules
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: node-modules-${{ github.sha }}
          path: /tmp
      - run: tar --use-compress-program="zstd -d" -xf /tmp/node_modules.tar.zst

      - name: Download all shard blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: playwright-blob-shard-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge blob reports into HTML
        run: npx playwright merge-reports --reporter html ./all-blob-reports || true

      - name: Upload merged HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-merged-html-report
          path: playwright-report
          retention-days: 30
          if-no-files-found: ignore

