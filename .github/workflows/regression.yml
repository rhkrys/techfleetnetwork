name: Regression

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      full_browser_matrix:
        description: "Run the full desktop/mobile/tablet browser matrix"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  schedule:
    # Nightly at 07:00 UTC — recurring full browser drift check.
    - cron: "0 7 * * *"

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# OWASP CI/CD security: minimum permissions on every job. Each job opts into more.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # setup — install dependencies ONCE, share node_modules + bun + playwright
  # browsers with downstream jobs. Cuts wall time ~60% vs. 4× npm ci.
  # ---------------------------------------------------------------------------
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      cache-hit: ${{ steps.cache-modules.outputs.cache-hit }}
    steps:
      - name: Checkout
        # actions/checkout@v5.0.0 — pinned to commit SHA (OWASP CI/CD)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Setup Node
        # actions/setup-node@v5.0.0 — pinned to commit SHA
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc

      - name: Setup Bun (for any predev/prebuild fallback scripts)
        # oven-sh/setup-bun@v2.0.1 — pinned to commit SHA
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: latest

      - name: Cache node_modules + npm tarballs
        id: cache-modules
        # actions/cache@v4.1.2 — pinned to commit SHA
        uses: actions/cache@0c45773b623bea8c8e75f6c82b208c3cf94ea4f9
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies (cache miss)
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Package node_modules for downstream jobs
        run: tar --use-compress-program=zstd -cf /tmp/node_modules.tar.zst node_modules

      - name: Upload node_modules artifact
        # actions/upload-artifact@v5.0.0 — pinned
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: node-modules-${{ github.sha }}
          path: /tmp/node_modules.tar.zst
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # quality — lint, typecheck, build, vitest, sbom, bdd-coverage in one job.
  # Same dep tree, no browsers needed — collapsing saves 3 cold starts.
  # ---------------------------------------------------------------------------
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: setup
    permissions:
      contents: read
    env:
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: latest

      - name: Restore node_modules
        # actions/download-artifact@v4.1.8 — pinned
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: node-modules-${{ github.sha }}
          path: /tmp
      - run: tar --use-compress-program="zstd -d" -xf /tmp/node_modules.tar.zst

      - name: Verify package signatures
        run: npm audit signatures
        continue-on-error: true

      - name: Lint (ESLint + browser-compat + CSS portability)
        run: npm run lint

      - name: Lint CSS
        run: npm run lint:css

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build production bundle
        run: npm run build

      - name: Run Vitest regression suite
        run: npm run test

      - name: Generate CycloneDX SBOM
        run: npm run sbom

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: cyclonedx-sbom
          path: sbom.json
          retention-days: 90

      - name: Generate BDD coverage report (gracefully skip if vars unset)
        if: env.SUPABASE_URL != '' && env.SUPABASE_ANON_KEY != ''
        run: npx tsx scripts/bdd-coverage.ts

      - name: BDD coverage skipped (missing env)
        if: env.SUPABASE_URL == '' || env.SUPABASE_ANON_KEY == ''
        run: echo "::notice::Skipping BDD coverage — SUPABASE_URL or SUPABASE_ANON_KEY not configured."

      - name: BDD scenario runner (reporting only)
        if: env.SUPABASE_URL != '' && env.SUPABASE_ANON_KEY != ''
        run: node scripts/bdd-scenario-runner.mjs

  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Dependency Review
        # actions/dependency-review-action@v4.5.0 — pinned
        uses: actions/dependency-review-action@4081bf99e2866ebe428fc0477b69eb4fcda7220a
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # ---------------------------------------------------------------------------
  # playwright — Chromium-only fast gate, sharded 3-way for parallelism.
  # Cross-browser matrix lives in cross-browser.yml (nightly + manual).
  # ---------------------------------------------------------------------------
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: setup
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: latest

      - name: Restore node_modules
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: node-modules-${{ github.sha }}
          path: /tmp
      - run: tar --use-compress-program="zstd -d" -xf /tmp/node_modules.tar.zst

      - name: Resolve Playwright version
        id: pw-version
        run: |
          PW_VER=$(node -p "require('./node_modules/@playwright/test/package.json').version")
          echo "version=$PW_VER" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@0c45773b623bea8c8e75f6c82b208c3cf94ea4f9
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}-chromium

      - name: Install Playwright browser (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        # nick-fields/retry@v3.0.2 — pinned
        uses: nick-fields/retry@7152eba30c6575329ac0576536151aca5a72780e
        with:
          timeout_minutes: 8
          max_attempts: 3
          command: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run fast Playwright gate (Chromium, shard ${{ matrix.shard }}/3)
        run: npx playwright test --shard=${{ matrix.shard }}/3

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: playwright-fast-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 30
