# Frontend deploy with VISIBILITY — the answer to "will the silent 11-day
# deploy failure happen again?": no, because a failed build/deploy now shows as
# a red check here (with logs) instead of the Cloudflare git integration failing
# silently and serving the old bundle forever.
#
# Additive + safe: guarded to a green no-op until the repo secrets are set, so
# merging this cannot break anything. Once CLOUDFLARE_API_TOKEN is present it
# builds + deploys via wrangler on every push to main. It does NOT disable the
# Cloudflare git-integration auto-build; once you've confirmed a green run here,
# turn that off in the Cloudflare dashboard so there's a single, visible path.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN            (Cloudflare → My Profile → API Tokens →
#                                    "Edit Cloudflare Workers" template)
#   CLOUDFLARE_ACCOUNT_ID          (Workers & Pages overview → right sidebar)
#   VITE_SUPABASE_URL              (public — https://pzvqxdgoztbfikfuifix.supabase.co)
#   VITE_SUPABASE_PUBLISHABLE_KEY  (public sb_publishable_… key)
#   VITE_SUPABASE_PROJECT_ID       (public — pzvqxdgoztbfikfuifix)
name: Deploy frontend (Cloudflare)

on:
  push:
    branches: [main]
    paths-ignore:
      - "supabase/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy is configured
        id: cfg
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN not set — skipping build/deploy. Add the repo secrets listed in this workflow to activate visible deploys."
          fi

      - name: Checkout
        if: steps.cfg.outputs.configured == 'true'
        # actions/checkout v4 — SHA-pinned (matches ci.yml; prior @v7.0.1 was not a real tag)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        if: steps.cfg.outputs.configured == 'true'
        # actions/setup-node v4 — SHA-pinned (matches ci.yml; prior @v7 was not a real tag)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.cfg.outputs.configured == 'true'
        run: npm ci --no-audit --no-fund

      - name: Build
        if: steps.cfg.outputs.configured == 'true'
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

      - name: Deploy to Cloudflare AND force the new version to 100% traffic
        if: steps.cfg.outputs.configured == 'true'
        # Gradual Deployments makes `wrangler deploy` upload a version but park it at 0% traffic
        # (the custom domain then serves the OLD version). So we deploy, capture the new Version ID
        # from the output, and explicitly promote it to 100%. Idempotent: if the Worker isn't
        # gradual, the promote just re-confirms 100%.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          out=$(npx wrangler deploy 2>&1); printf '%s\n' "$out"
          vid=$(printf '%s\n' "$out" \
            | grep -oiE 'Current Version ID:[[:space:]]*[0-9a-fA-F-]{36}' \
            | grep -oiE '[0-9a-fA-F-]{36}' | head -n1 || true)
          if [ -n "$vid" ]; then
            echo "Forcing version $vid to 100% traffic (defeats gradual-deploy 0% parking)"
            npx wrangler versions deploy "${vid}@100%" -y
          else
            echo "::warning::Could not parse the new Version ID; if the site is stale, promote to 100% manually (wrangler versions deploy <id>@100% -y)."
          fi

      - name: Verify production is serving THIS commit at 100%
        if: steps.cfg.outputs.configured == 'true' && vars.PROD_URL != ''
        env:
          PROD_URL: ${{ vars.PROD_URL }}
          EXPECT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          url="${PROD_URL%/}/build-info.json"
          echo "Confirming $url serves sha=$EXPECT_SHA"
          for i in $(seq 1 20); do
            live=$(curl -fsS --max-time 15 -H 'cache-control: no-cache' "$url" 2>/dev/null | tr -d ' \n\r\t' || true)
            echo "attempt $i: $live"
            case "$live" in
              *"\"sha\":\"$EXPECT_SHA\""*) echo "✅ Live at 100% with the deployed commit."; exit 0 ;;
            esac
            sleep 15
          done
          echo "::error::Deploy reported success but production is NOT serving $EXPECT_SHA — investigate promotion/traffic split."
          exit 1
