name: Apply BDD scenario (one-shot)

# TEMPORARY helper: upserts the DISCORD-RESOLVE-NOTFOUND-SEVERITY-001 bdd_scenarios
# row into the live project so incident-gate can see its regression coverage.
# Migrations do not auto-apply on the new project (cutover gap), so this bridges
# the gap once. Removed from the branch before PR #123 merges.
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Upsert bdd_scenarios row via PostgREST
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Missing SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY"; exit 1
          fi
          cat > /tmp/row.json <<'JSON'
          {
            "scenario_id": "DISCORD-RESOLVE-NOTFOUND-SEVERITY-001",
            "feature_area": "Discord",
            "feature_area_number": 47,
            "title": "Discord username-not-found is benign (severity:info), not a system error",
            "gherkin": "Feature: Discord handle resolution\n  Scenario: A member types a handle that is not in the guild yet\n    Given the guild member search returns zero candidates\n    When resolve-discord-id classifies the result\n    Then the audit event is tagged severity:info and result_count:0\n    And the response is HTTP 200 \"User not found in server\"\n    And it is never reported as a system error",
            "status": "implemented",
            "test_type": "unit",
            "test_file": "supabase/functions/resolve-discord-id/result-classifier.test.ts",
            "notes": "Locks in resolved incident:18d6186852440c10628b405e76ea6c466cee8e1c — a 0-candidate Discord guild search is expected UX, classified severity:info (triage-skipped) and returned HTTP 200, not a system error. Regression guard: result-classifier.test.ts."
          }
          JSON
          code=$(curl -s -o /tmp/resp.json -w '%{http_code}' \
            -X POST "$SUPABASE_URL/rest/v1/bdd_scenarios?on_conflict=scenario_id" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=representation" \
            --data @/tmp/row.json)
          echo "HTTP $code"
          cat /tmp/resp.json
          echo
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            echo "::error::Upsert failed (HTTP $code)"; exit 1
          fi
          echo "Upserted DISCORD-RESOLVE-NOTFOUND-SEVERITY-001."
