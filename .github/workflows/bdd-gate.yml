name: BDD gate

# Enforces the project rule: every feature must have a Gherkin scenario.
# On PRs that touch src/services, src/pages, or supabase/functions, we diff
# against main and check whether the changed module has any test coverage in
# the local test tree — a local grep that needs no production DB (D-13).

on:
  pull_request:
    paths:
      - "src/services/**"
      - "src/pages/**"
      - "supabase/functions/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  bdd-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Compute changed feature modules
        id: diff
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          mapfile -t files < <(git diff --name-only "origin/${{ github.base_ref }}"...HEAD \
            | grep -E '^(src/services/|src/pages/|supabase/functions/)' \
            | grep -v '_manifest\.json$' \
            || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No feature modules changed."
            echo "modules=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t modules < <(printf '%s\n' "${files[@]}" \
            | awk -F/ '{print $1"/"$2"/"$3}' | sort -u)
          printf 'Changed modules:\n%s\n' "${modules[@]}"
          { echo "modules<<EOF"; printf '%s\n' "${modules[@]}"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Verify each module has test coverage (local grep, D-13)
        if: steps.diff.outputs.modules != ''
        run: |
          missing=()
          while IFS= read -r mod; do
            [ -z "$mod" ] && continue
            name="${mod##*/}"

            # Primary check: does any test file reference the full module path?
            # (e.g. src/services/email — specific enough to avoid false positives)
            if grep -rl "$mod" src/test e2e 2>/dev/null | head -1 | grep -q .; then
              continue
            fi

            # Fallback: module basename, but only for names long enough (≥6 chars)
            # to avoid common words (auth, user, page) matching unrelated tests.
            if [ "${#name}" -ge 6 ]; then
              if grep -rl "$name" src/test e2e 2>/dev/null | head -1 | grep -q .; then
                continue
              fi
            fi

            # Edge functions are covered by Deno tests (co-located or shared
            # *.test.ts under supabase/functions) which the src/test|e2e greps
            # above cannot see. Count those too — but ONLY test files (--include),
            # so a function's own source referencing its name doesn't self-satisfy.
            if grep -rl --include='*.test.ts' "$mod" supabase/functions 2>/dev/null | head -1 | grep -q .; then
              continue
            fi
            if [ "${#name}" -ge 6 ] && grep -rl --include='*.test.ts' "$name" supabase/functions 2>/dev/null | head -1 | grep -q .; then
              continue
            fi

            missing+=("$mod")
          done <<< "${{ steps.diff.outputs.modules }}"

          if [ "${#missing[@]}" -gt 0 ]; then
            {
              echo "## BDD gate"
              echo
              echo "The following changed modules have **no test coverage** in \`src/test/\` or \`e2e/\`:"
              for m in "${missing[@]}"; do echo "- \`$m\`"; done
              echo
              echo "Add a test that references this module path before merging."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All changed modules have test coverage."
