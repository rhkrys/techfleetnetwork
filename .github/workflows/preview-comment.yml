name: PR preview comment

# Posts the Lovable preview URL for the PR's branch as a comment on
# every new PR (or update). Lovable itself publishes the preview; we
# just surface the link.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Upsert preview-URL comment
        # actions/github-script@v7.0.1 — pinned
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const projectId = '3ae718a9-cd87-4a00-991b-209d8baa78ad';
            const previewUrl = `https://id-preview--${projectId}.lovable.app`;
            const marker = '<!-- lovable-preview-comment -->';
            const body = [
              marker,
              `### 🔗 Lovable preview`,
              ``,
              `Latest preview for this branch: ${previewUrl}`,
              ``,
              `_Updates automatically on every push._`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
