name: Deploy edge functions

# Deploys every supabase/functions/* to the owned Supabase project on push to
# main. Closes the cutover gap that broke Fleety/captcha/auth: the migration
# moved the frontend, DB, and storage but never deployed the edge functions to
# the new project, so every /functions/v1/* returned a gateway 503 ("Failed to
# fetch"). On Lovable, deploys were automatic; on the owned project they are
# not — this workflow makes them automatic again so they can't silently drift.
#
# One-time setup (Cowork):
#   - Add repo secret SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens).
#   - Set each function's runtime SECRETS once on the project (NOT managed here):
#       supabase secrets set GEMINI_API_KEY=… FIRECRAWL_API_KEY=… \
#         TURNSTILE_SECRET_KEY=… --project-ref pzvqxdgoztbfikfuifix
#     (SUPABASE_URL / ANON_KEY / SERVICE_ROLE_KEY are auto-injected.)
#
# Per-function verify_jwt is read from supabase/config.toml (already pinned by
# the edge-function-coverage gate), so the access model deploys correctly.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: pzvqxdgoztbfikfuifix

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Guard — access token present
        id: guard
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN is not set — skipping edge-function deploy. Add the repo secret to enable automatic deploys."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Install Supabase CLI
        if: steps.guard.outputs.skip != 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy edge functions (one by one, resilient)
        if: steps.guard.outputs.skip != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -u
          ok=0
          failed=""
          for dir in supabase/functions/*/; do
            name="$(basename "$dir")"
            [ "$name" = "_shared" ] && continue
            [ -f "${dir}index.ts" ] || { echo "skip $name (no index.ts)"; continue; }
            echo "::group::deploy $name"
            if supabase functions deploy "$name" --project-ref "$SUPABASE_PROJECT_REF"; then
              ok=$((ok + 1))
              echo "OK: $name"
            else
              failed="$failed $name"
              echo "::warning::FAILED to deploy $name"
            fi
            echo "::endgroup::"
          done
          echo "==================================================="
          echo "Deployed OK: $ok"
          if [ -n "$failed" ]; then
            echo "FAILED functions:$failed"
            echo "::warning::These functions failed to deploy:$failed"
          else
            echo "All functions deployed successfully."
          fi
          # Only hard-fail if NOTHING deployed (systemic auth/CLI/project issue).
          if [ "$ok" -eq 0 ]; then
            echo "::error::No functions deployed — check SUPABASE_ACCESS_TOKEN and project ref."
            exit 1
          fi
