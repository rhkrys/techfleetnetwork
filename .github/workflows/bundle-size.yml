# Bundle-size budget — fails the build if main entry or total initial JS
# grows past the budgets in package.json["size-limit"]. Non-blocking on
# first rollout: marked `continue-on-error: true` so the baseline can be
# inspected before tightening.
#
# Report-only mode lets us tune budgets to the actual current size before
# making this a required check.
name: Bundle Size

on:
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "bun.lockb"
      - "vite.config.ts"
      - ".github/workflows/bundle-size.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: bundle-size-${{ github.ref }}
  cancel-in-progress: true

jobs:
  size:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
        env:
          CI: "true"
      - name: Run size-limit
        id: size
        continue-on-error: true
        run: npx size-limit --json | tee size-report.json
      - name: Upload size report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: size-limit-report
          path: size-report.json
          retention-days: 30
